*{box-sizing:border-box}

<body>
<header>
  <div class="brand"><span class="plate"><img class="logo" src="/*LOGO*/" alt="EUROVIA"></span><h1>Gewerke-Anfragen<span class="poc">PoC</span></h1></div>
  <nav><button id="tabA" class="on">Anfrage</button><button id="tabN">Subunternehmer</button><button id="tabR">Regeln</button><button id="tabH">Anleitung</button></nav>
  <span class="sp"></span>
  <span class="mut" id="lvInfo"></span>
</header>
<main>
  <section id="viewA">
    <div class="steps" id="steps"></div>
    <div id="step"></div>
  </section>
  <section id="viewN" hidden></section>
  <section id="viewR" hidden></section>
  <section id="viewH" class="help" hidden></section>
</main>
<div class="foot" id="foot"></div>

<script>/*DATA*/</script>
<script>/*GAEB*/</script>
<script>/*X83*/</script>
<script>/*PDFJS*/</script>
<script id="pdfworker" type="text/plain">/*PDFWORKER*/</script>
<script>/*PDFSITE*/</script>
<script>/*ENGINE*/</script>
<script>
'use strict';
// ------------------------------------------------------------ Speicher
const store = {
  get(k, d) { try { const v = localStorage.getItem('gwa.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gwa.' + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtKm = d => d == null ? '–' : Math.round(d) + ' km';

// Gewerke-Stammdaten (Kürzel -> Name, Arten); Änderungen lokal gespeichert
const GW = JSON.parse(JSON.stringify(DATA.gewerke));
Object.assign(GW, store.get('gewerke', {}));
const saveGW = () => {
  const diff = {};
  for (const k in GW) if (JSON.stringify(GW[k]) !== JSON.stringify(DATA.gewerke[k])) diff[k] = GW[k];
  store.set('gewerke', diff);
};
const EIGEN = 'EIGEN'; // Pseudo-Gewerk: wird selbst ausgeführt, keine Anfrage
const gwName = c => c === EIGEN ? 'Eigenleistung' : (GW[c]?.name || c);
const isGw = c => c && c !== EIGEN;

// Subunternehmer-Notizen: key = "Firma (Ort)"
const firmKey = f => f.firma + (f.ort ? ' (' + f.ort + ')' : '');
const NU = store.get('nu', null) || (() => {
  const seed = {};
  for (const f of DATA.firms) if (f.bem.some(b => /nicht mehr anfragen/i.test(b)))
    seed[firmKey(f)] = { comment: '', sperre: true, bis: '2025-12-31', grund: f.bem.find(b => /nicht mehr anfragen/i.test(b)) };
  return seed;
})();
const saveNU = () => store.set('nu', NU);
const today = new Date().toISOString().slice(0, 10);
const sperrStatus = f => {
  const n = NU[firmKey(f)];
  if (!n || !n.sperre) return null;
  if (n.bis && n.bis < today) return { aktiv: false, text: 'Sperre abgelaufen (' + n.bis + ')' };
  return { aktiv: true, text: 'Gesperrt' + (n.bis ? ' bis ' + n.bis : '') + (n.grund ? ': ' + n.grund : '') };
};

const norm = c => DATA.alias[c] || c;
// Vorschlags-Regeln: Stichwörter, Katalognummern, Beispiele (mitgelernt aus bestätigten Anfragen)
const KW_SEED = /*KW*/;
const CORPUS = DATA.corpus.map(([text, codes, kat, src, kurz]) => ({ text, codes: codes.map(norm), kat, src, kurz }));
let KW = store.get('kw', null) || KW_SEED;
let KAT = store.get('kat', null) || ENGINE.learnKatRules(CORPUS);
let LEARNED = store.get('beispiele', []);
let suggest;
function rebuild() { suggest = ENGINE.make(CORPUS.concat(LEARNED), KW, KAT); }
rebuild();

// ------------------------------------------------------------ Zustand
const S = {
  step: 0, file: null, lv: null,
  assign: new Map(),     // oz -> Set(kürzel)
  reason: new Map(),     // oz -> {reason, sure} des Vorschlags
  view: 'gw',            // 'gw' = nach Gewerk, 'lv' = LV-Reihenfolge
  pick: new Set(),       // "kürzel|oz" = Position wird in dieser Anfrage mitgeschickt
  collapsed: new Set(),
  filter: '',
  site: null,            // {label, lat, lng}
  siteText: '',
  firms: {},             // kürzel -> Set(firm id)
  openGw: null,
};

const STEPS = ['LV einlesen', 'Leistungen & Gewerke', 'Baustelle', 'Anbieter', 'Export'];
function renderSteps() {
  $('#steps').innerHTML = STEPS.map((t, i) =>
    `<div class="${i === S.step ? 'on' : ''} ${!S.lv && i > 0 ? 'dis' : ''}" data-i="${i}"><span class="n">${i + 1}</span>${t}</div>`).join('');
  $('#steps').querySelectorAll('div').forEach(d => d.onclick = () => { if (S.lv || +d.dataset.i === 0) go(+d.dataset.i); });
}
function go(i) { S.step = i; render(); window.scrollTo(0, 0); }
function render() {
  renderSteps();
  [renderLoad, renderGewerke, renderSite, renderFirms, renderExport][S.step]();
  $('#lvInfo').textContent = S.lv ? `${S.file} · ${S.lv.info.auftraggeber} · ${S.lv.items.length} Positionen` : '';
}
function foot(html) { $('#foot').innerHTML = html; $('#foot').hidden = !html; }

// ------------------------------------------------------------ 1. Einlesen
function renderLoad() {
  $('#step').innerHTML = `
  <div class="card"><h2>Ausschreibung einlesen</h2>
    <p class="mut">Am besten den ganzen Ausschreibungsordner hierher ziehen. Der PoC nimmt sich daraus das Gesamt-LV (.D83 oder .X83) und liest die Baustelle aus der „Aufforderung zur Angebotsabgabe“ (PDF). Eine einzelne LV-Datei geht auch. Alles bleibt auf diesem Rechner.</p>
    <div class="drop" id="drop">Ordner oder LV-Datei hier ablegen</div>
    <div class="row" style="margin-top:8px">
      <label class="s" style="cursor:pointer">Ordner wählen<input type="file" id="dirIn" webkitdirectory multiple hidden></label>
      <label class="s" style="cursor:pointer">Einzelne LV-Datei wählen<input type="file" id="fileIn" accept=".d83,.D83,.p83,.P83,.x83,.X83" hidden></label>
    </div>
    <div id="loadMsg" class="hint" style="margin-top:8px"></div>
  </div>
  <p class="mut">Zum ersten Mal hier? Die <a href="#" id="toHelp">Anleitung</a> erklärt alle Schritte.</p>`;
  $('#toHelp').onclick = e => { e.preventDefault(); showTab('H'); };
  const drop = $('#drop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = async e => { e.preventDefault(); drop.classList.remove('over'); loadFiles(await droppedFiles(e.dataTransfer)); };
  $('#dirIn').onchange = e => loadFiles([...e.target.files]);
  $('#fileIn').onchange = e => loadFiles([...e.target.files]);
  foot(S.lv ? `<button class="b" onclick="go(1)">Weiter</button>` : '');
}
// abgelegte Dateien und Ordner (rekursiv) einsammeln
async function droppedFiles(dt) {
  const entries = [...dt.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const walk = async en => {
    if (en.isFile) out.push(await new Promise((ok, no) => en.file(ok, no)));
    else if (en.isDirectory) {
      const r = en.createReader();
      for (let batch; (batch = await new Promise((ok, no) => r.readEntries(ok, no))).length;) for (const c of batch) await walk(c);
    }
  };
  for (const en of entries) await walk(en);
  return out;
}
// Gesamt-LV im Ordner finden: die Datei, auf die sich die Gewerke-Dateien (KÜRZEL_<name>) beziehen
function pickMain(files) {
  const lvs = files.filter(f => /\.(d83|x83|p83)$/i.test(f.name));
  if (lvs.length < 2) return lvs[0];
  const ref = lvs.find(f => lvs.some(g => g !== f && g.name.endsWith('_' + f.name)));
  if (ref) return ref;
  const plain = lvs.filter(f => !/^[A-ZÄÖÜ]+_/.test(f.name));
  const pool = plain.length ? plain : lvs;
  return pool.sort((x, y) => (/\.d83$/i.test(y.name) - /\.d83$/i.test(x.name)) || y.size - x.size)[0];
}
async function loadFiles(files) {
  const msg = t => $('#loadMsg').textContent = t;
  const main = pickMain(files);
  if (!main) return msg('Keine LV-Datei (.D83 oder .X83) gefunden.');
  try {
    const bytes = new Uint8Array(await main.arrayBuffer());
    // GAEB-XML beginnt mit '<' (ggf. nach BOM/Leerzeichen), GAEB 90 mit Satzart-Ziffern
    const head = new TextDecoder().decode(bytes.slice(0, 200)).replace(/^﻿?\s*/, '');
    const lv = head.startsWith('<') ? X83.parse(new TextDecoder().decode(bytes)) : GAEB.parse(GAEB.decode(bytes));
    if (!lv.items.length) throw new Error('keine Positionen gefunden');
    S.lv = lv; S.file = main.name;
    S.firms = {};
    clearAssign();
    S.siteText = guessSite(lv, main.name); S.siteSrc = 'dem LV';
    S.site = null;
  } catch (e) { return msg(`${main.name} konnte nicht gelesen werden: ${e.message}`); }
  const auf = files.filter(f => /aufforderung/i.test(f.name) && /\.pdf$/i.test(f.name)).sort((x, y) => x.size - y.size)[0];
  if (auf) {
    msg(`${main.name} gelesen, lese Baustelle aus ${auf.name} …`);
    try {
      const s = PDFSITE.site(await PDFSITE.text(auf), agOrt(S.lv.info));
      if (s) { S.siteText = s; S.siteSrc = auf.name; }
    } catch (e) { console.warn('Aufforderung nicht lesbar', e); }
  }
  go(1);
}

// Startzustand: alles nicht zugeordnet, bis „Intelligente Zuordnung“ gedrückt wird
function clearAssign() {
  S.assign.clear(); S.reason.clear(); S.pick.clear();
  for (const it of S.lv.items) S.assign.set(it.oz, new Set());
}
// onlyEmpty: nur Positionen ohne Zuordnung füllen, manuelle Zuordnungen bleiben
function applySuggestions(onlyEmpty) {
  if (!onlyEmpty) { S.assign.clear(); S.reason.clear(); S.pick.clear(); }
  for (const it of S.lv.items) {
    if (onlyEmpty && S.assign.get(it.oz)?.size) continue;
    const r = suggest(it);
    const codes = r.codes.map(norm).filter(c => GW[c]);
    S.assign.set(it.oz, new Set(codes.length ? codes : [EIGEN]));
    S.reason.set(it.oz, r);
    codes.forEach(c => S.pick.add(c + '|' + it.oz));
  }
}

// ------------------------------------------------------------ 2. Leistungen & Gewerke
function groups() {
  const g = new Map();
  for (const it of S.lv.items) {
    const cs = S.assign.get(it.oz);
    if (!cs.size) { if (!g.has('')) g.set('', []); g.get('').push(it); }
    for (const c of cs) { if (!g.has(c)) g.set(c, []); g.get(c).push(it); }
  }
  const keys = [...g.keys()].filter(isGw).sort((a, b) => gwName(a).localeCompare(gwName(b)));
  if (g.has(EIGEN)) keys.push(EIGEN);
  if (g.has('')) keys.push('');
  return keys.map(k => [k, g.get(k)]);
}
const activeGw = () => groups().filter(([c, its]) => isGw(c) && its.some(it => S.pick.has(c + '|' + it.oz))).map(([c]) => c);

// ------------------------------------------------------------ 3. Baustelle
// Baustelle aus dem LV erraten: Straße aus LV-Bezeichnung, Abschnittstiteln oder Dateiname, Ort aus dem Auftraggeber
const STRASSE = /\b([A-ZÄÖÜ][a-zäöüß-]+(?:er)? (?:Straße|Str\.|Weg|Allee|Ring|Platz|Damm|Chaussee)|[A-ZÄÖÜ][a-zäöüß-]+(?:straße|str\.|weg|allee|ring|platz|damm|chaussee))(?![a-zäöüß])/;
const STRNR = /\b([ABLK] ?\d{1,4})\b/;
// Ort nur, wenn eine Stadt (oder ihr Verkehrsbetrieb) ausschreibt; der Landesbetrieb baut nicht an seinem Sitz
function agOrt(info) {
  const ag = info.auftraggeber || '', m = /Stadt\s+(\S+)/.exec(ag);
  return m ? m[1] : /moBiel/i.test(ag) ? 'Bielefeld' : '';
}
function guessSite(lv, file) {
  const info = lv.info, ort = agOrt(info);
  const titles = [];
  (function walk(g, d) { for (const c of g.children) if (!c.records) { titles.push(c.title); if (d < 2) walk(c, d + 1); } })(lv.root, 0);
  const texts = [info.bezeichnung, ...titles, (file || '').replace(/[_]+/g, ' ')];
  const str = texts.map(t => STRASSE.exec(t || '')).find(Boolean)?.[1].replace(/Str\.$/, 'Straße');
  if (str) return ort ? `${str}, ${ort}` : str;
  // Landesstraßen o. Ä.: Straßennummer als Hinweis, Ort muss ergänzt werden
  const nr = STRNR.exec(info.bezeichnung || '');
  return [nr && nr[1], ort].filter(Boolean).join(', ');
}
const ortIndex = new Map(Object.entries(DATA.orte).map(([o, p]) => [o.toLowerCase(), p]));
async function locate(q) {
  q = q.trim();
  const plz = /\b(\d{5})\b/.exec(q);
  if (plz && DATA.plz[plz[1]]) { const [lat, lng] = DATA.plz[plz[1]]; return { label: 'PLZ ' + plz[1], lat, lng, src: 'PLZ-Mittelpunkt' }; }
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (j.length) return { label: j[0].display_name, lat: +j[0].lat, lng: +j[0].lon, src: 'Adresssuche (OpenStreetMap)' };
  } catch (e) { /* offline: weiter mit Ortsliste */ }
  // Ortsname irgendwo im Text suchen, z. B. "Detmolder Straße, Bielefeld"
  const words = q.split(/[,;]/).map(w => w.trim()).concat(q.split(/[\s,;]+/)).reverse();
  const hit = words.find(w => ortIndex.has(w.toLowerCase()));
  const p = hit && ortIndex.get(hit.toLowerCase()); q = hit || q;
  if (p && DATA.plz[p]) { const [lat, lng] = DATA.plz[p]; return { label: q + ' (PLZ ' + p + ')', lat, lng, src: 'Ortsliste' }; }
  return null;
}

function dist(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLa = r(b[0] - a.lat), dLo = r(b[1] - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b[0])) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function candidates(c) {
  const arten = new Set(GW[c]?.arten || []);
  return DATA.firms.filter(f => f.arten.some(a => arten.has(a))).map(f => {
    const d = f.geo && S.site ? dist(S.site, f.geo) : null;
    return { f, d, sp: sperrStatus(f) };
  }).sort((a, b) => (a.d ?? 1e9) - (b.d ?? 1e9));
}

function stem() { return S.file.replace(/\.[^.]+$/, ''); }
function ext() { const m = /\.[^.]+$/.exec(S.file); return m ? m[0] : S.lv.format === 'x83' ? '.X83' : '.D83'; }
function datum() { const d = new Date(); return [d.getDate(), d.getMonth() + 1, d.getFullYear() % 100].map(x => String(x).padStart(2, '0')).join('.'); }
function anfrageFiles() {
  return activeGw().map(c => {
    const oz = new Set(S.lv.items.filter(it => S.pick.has(c + '|' + it.oz)).map(it => it.oz));
    return { c, name: `${c}_${stem()}${ext()}`, text: S.lv.format === 'x83' ? X83.build(S.lv, gwName(c), oz, new Date().toISOString().slice(0, 10)) : GAEB.build(S.lv, gwName(c), oz, datum()), n: oz.size };

// In claude.ai läuft die Seite in einem Rahmen, der Downloads nur über die downloads-Fähigkeit erlaubt
const dlCap = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function download(bytes, name, type) {
  const cap = await dlCap;
  if (cap) {
    try { await cap.save({ filename: name, data: bytes instanceof Blob ? bytes : new Blob([bytes], { type }) }); }
    catch (e) { if (e?.code !== 'declined') console.warn('Download nicht möglich', e); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
// Minimaler ZIP-Writer (ohne Kompression)
function zip(entries) {
  const crcT = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c; });
  const crc = b => { let c = ~0; for (const x of b) c = crcT[(c ^ x) & 255] ^ (c >>> 8); return ~c >>> 0; };
  const parts = [], central = []; let off = 0;
  const u16 = v => [v & 255, v >>> 8 & 255], u32 = v => [v & 255, v >>> 8 & 255, v >>> 16 & 255, v >>> 24 & 255];
  for (const [name, data] of entries) {
    const nb = new TextEncoder().encode(name), c = crc(data);
    const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0)];
    const local = new Uint8Array([...u32(0x04034b50), ...common, ...nb]);
    parts.push(local, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off), ...nb]));
    off += local.length + data.length;
  }
  const cl = central.reduce((s, x) => s + x.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(entries.length), ...u16(entries.length), ...u32(cl), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...central, end]);
}

    <ol>
      <li><b>Katalog-Regel</b>: Die Katalognummer beginnt mit einer bekannten Nummer (nur bei LV mit Katalognummern, z. B. Straßen.NRW).</li>
      <li><b>Stichwort</b>: Ein Stichwort steht im Kurztext, z. B. „Markierung“.</li>
      <li><b>Ähnlichste bekannte Position</b> aus den Beispielpaketen und allen bereits exportierten LV.</li>
    </ol>
    <p>Stichwörter und Katalog-Regeln lassen sich hier ergänzen oder löschen. Gelernte Beispiele können je LV entfernt werden. Mit „Vorschläge für aktuelles LV neu berechnen“ wirken Änderungen sofort, dabei wird die Zuordnung im aktuellen LV überschrieben.</p>

    <h3 id="hT">Tipps</h3>
    <ul>
      <li>Notizen, Regeln und gelernte Beispiele werden nur in diesem Browser gespeichert. Für einen anderen Rechner oder Browser über „exportieren“ und „importieren“ übertragen.</li>
      <li>Ein neues LV lässt sich jederzeit über Schritt 1 einlesen. Die bisherige Zuordnung wird dann verworfen.</li>
    </ul>
  </div>`;
  $('#viewH').querySelectorAll('.toc a').forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
}
render();
</script>
